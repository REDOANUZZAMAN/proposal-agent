<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposal Agent · 项目申报书生成智能体</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#d9dde3;--ac:#1d4ed8;--ok:#15803d;--wa:#b45309;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--tx:#e6e9ee;--mut:#98a2b3;--bd:#2a323c;--ac:#6ea0ff;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}h1{font-size:18px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
textarea,input{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
textarea{min-height:90px;resize:vertical}button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:5px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.mut{color:var(--mut);font-size:12px}
.ch{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}.ch label{font-size:12px;color:var(--mut);display:block;margin:6px 0 2px}
.ok{color:var(--ok)}.partial{color:var(--wa)}.missing{color:var(--er)}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
#err{color:var(--er)}
</style></head><body><main>
<h1>项目申报书生成智能体 <span class="mut">Proposal Agent</span></h1>
<div class="card"><h2>1. 申报指南 Funding guide</h2>
<textarea id="guide" placeholder="粘贴申报指南文本，或上传 .txt / .md / .docx / .pdf"></textarea>
<div class="row"><input type="file" id="file" accept=".txt,.md,.docx,.pdf" style="width:auto"><span class="mut" id="fmeta"></span></div></div>
<div class="card"><h2>2. 你的项目想法 Your idea</h2>
<textarea id="idea" placeholder="项目名称、要解决的问题、拟用方法、团队基础……（写得越具体越好；缺失信息会标为[待补充]，不会编造）"></textarea>
<div class="row"><button class="p" id="plan">生成章节与提示词 Plan chapters</button><span class="mut">AI 会按指南列出章节，每章的提示词可自行修改</span></div></div>
<div class="card" id="chs" hidden><h2>3. 分章节提示词与正文 Chapters (editable prompts)</h2><div id="list"></div>
<div class="row"><button class="p" id="all">按顺序生成全部 Generate all</button><button id="chk">检查是否符合指南 Check</button><button id="exp">导出 Word Export</button><span class="mut" id="st"></span></div></div>
<div class="card" id="rep" hidden><h2>4. 合规检查 Compliance check</h2><div id="rt"></div></div>
<div id="err"></div></main>
<script>
const $=id=>document.getElementById(id);let chapters=[];
async function api(p,b){const r=await fetch(p,{method:'POST',body:b instanceof ArrayBuffer?b:JSON.stringify(b)});
 if(!r.ok){let m=r.statusText;try{m=(await r.json()).error}catch(e){}throw new Error(m)}return r}
const busy=async(btn,f)=>{btn.disabled=true;$('err').textContent='';try{await f()}catch(e){$('err').textContent='错误 Error: '+e.message}btn.disabled=false};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;await busy($('file'),async()=>{
 const r=await api('/api/extract?name='+encodeURIComponent(f.name),await f.arrayBuffer());$('guide').value=(await r.json()).text;$('fmeta').textContent=f.name+' · '+$('guide').value.length+' 字符'})};
$('plan').onclick=()=>busy($('plan'),async()=>{if(!$('guide').value.trim())throw new Error('请先提供申报指南');
 const j=await(await api('/api/outline',{guide:$('guide').value,idea:$('idea').value})).json();
 chapters=j.chapters.map(c=>({...c,text:''}));render();$('chs').hidden=false});
function render(){$('list').innerHTML='';chapters.forEach((c,i)=>{const d=document.createElement('div');d.className='ch';
 d.innerHTML=`<b>${i+1}. </b><input value="${c.title.replace(/"/g,'&quot;')}" data-k="title" style="width:60%">
 ${c.requirements&&c.requirements.length?`<div class="mut">指南要求: ${c.requirements.join('；')}</div>`:''}
 <label>提示词 Prompt（可修改）</label><textarea data-k="prompt" style="min-height:60px"></textarea>
 <label>正文 Draft（可修改）</label><textarea data-k="text" style="min-height:140px"></textarea>
 <div class="row"><button data-g>生成本章 Generate</button></div>`;
 d.querySelectorAll('[data-k]').forEach(el=>{if(el.tagName=='TEXTAREA')el.value=c[el.dataset.k];el.oninput=()=>c[el.dataset.k]=el.value});
 d.querySelector('[data-g]').onclick=ev=>busy(ev.target,()=>gen(i,d));$('list').append(d)})}
async function gen(i,d){$('st').textContent=`正在生成 ${i+1}/${chapters.length} …`;
 const prev=chapters.slice(0,i).filter(c=>c.text.trim());
 const j=await(await api('/api/chapter',{guide:$('guide').value,idea:$('idea').value,chapter:chapters[i],previous:prev})).json();
 chapters[i].text=j.text;d.querySelector('[data-k=text]').value=j.text;$('st').textContent=''}
$('all').onclick=()=>busy($('all'),async()=>{const ds=$('list').children;for(let i=0;i<chapters.length;i++)await gen(i,ds[i]);$('st').textContent='完成 Done'});
$('chk').onclick=()=>busy($('chk'),async()=>{$('st').textContent='检查中 …';
 const j=await(await api('/api/check',{guide:$('guide').value,chapters:chapters.filter(c=>c.text.trim())})).json();$('st').textContent='';
 const esc=s=>String(s??'').replace(/[<&]/g,m=>m=='<'?'&lt;':'&amp;');
 $('rt').innerHTML='<table><tr><th>要求 Requirement</th><th>状态</th><th>位置</th><th>说明</th></tr>'+j.items.map(x=>`<tr><td>${esc(x.requirement)}</td><td class="${x.status}">${x.status}</td><td>${esc(x.where)}</td><td>${esc(x.note)}</td></tr>`).join('')+'</table>';$('rep').hidden=false});
$('exp').onclick=()=>busy($('exp'),async()=>{const r=await api('/api/export',{title:($('idea').value.split('\n')[0]||'项目申报书').slice(0,60),chapters:chapters.filter(c=>c.text.trim())});
 const u=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=u;a.download='proposal.docx';a.click()});
</script></body></html>
