<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目申报书生成系统 · Proposal Agent</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--tx:#221f1c;--mut:#70675c;--bd:#ddd3c2;--ac:#8b1e2d;--acbg:#f6e7e4;--gold:#b8892b;--navy:#1d3557;--ok:#2e6b3f;--wa:#8a5a00;--er:#9b2c2c;--serif:"Noto Serif SC","Songti SC",SimSun,Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#171412;--card:#211d1a;--tx:#ebe5dc;--mut:#a39a8d;--bd:#3a332c;--ac:#e0707c;--acbg:#33201f;--gold:#d9a94a;--navy:#8fb1de;--ok:#7bc08d;--wa:#e0b25a;--er:#e48a8a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--ac);color:#fff;border-bottom:3px solid var(--gold);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font:600 16px var(--serif);margin:0;letter-spacing:.5px}header small{color:#f0d9d6}header button{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}header button:hover:not(:disabled){background:#fff;color:var(--ac);border-color:#fff}header .sp{flex:1}
.wrap{display:grid;grid-template-columns:230px 1fr;max-width:1240px;margin:0 auto;min-height:calc(100vh - 50px)}
aside{border-right:1px solid var(--bd);padding:14px 12px;background:var(--card);border-top:0}
aside h3{font-size:12px;color:var(--navy);margin:14px 0 6px;font-weight:600;letter-spacing:.5px}aside h3:first-child{margin-top:0}
.nav a{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:3px;cursor:pointer;color:var(--tx);text-decoration:none;font-size:13px}
.nav a:hover{background:var(--acbg)}.nav a.on{background:var(--acbg);color:var(--ac);font-weight:600}.nav .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mut);flex:none}.nav .dot.f{background:var(--ok);border-color:var(--ok)}
.meter{height:5px;background:var(--bd);margin:4px 0}.meter i{display:block;height:100%;background:var(--gold)}.meter.over i{background:var(--er)}
main{padding:18px 22px;min-width:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 16px;color:var(--mut);font-size:14px}
.tabs button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
.sec{background:var(--card);border:1px solid var(--bd);padding:16px 18px;margin-bottom:14px}
.sec{border-top:3px solid var(--navy)}.sec h2{font:600 15px var(--serif);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bd);color:var(--navy)}
textarea,input,select{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:3px;padding:7px 9px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}textarea{min-height:100px;resize:vertical;line-height:1.65}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:3px;padding:6px 14px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.p:hover:not(:disabled){color:#fff;opacity:.9}button:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.sp{flex:1}.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.grid label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
label.l{font-size:12px;color:var(--mut);display:block;margin:10px 0 3px}
.req{font-size:12.5px;background:#fbf1d9;color:#3b2f10;border-left:3px solid var(--gold);padding:6px 10px;margin:8px 0}
.tag.ok{background:#e4f1e7}.tag.partial{background:#fbf1d9}.tag.missing{background:#f8e3e1}.tag{font-size:12px;padding:1px 8px;border:1px solid var(--bd);color:var(--mut);border-radius:2px}.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.partial{color:var(--wa);border-color:var(--wa)}.tag.missing{color:var(--er);border-color:var(--er)}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-weight:600;background:var(--bg)}
.sum{display:flex;gap:28px;margin-bottom:12px;flex-wrap:wrap}.sum div{min-width:90px}.sum b{display:block;font:600 26px var(--serif);color:var(--navy)}.sum span{font-size:12px;color:var(--mut)}
.doc{background:#fff;color:#111;border:1px solid var(--bd);max-width:780px;margin:0 auto;padding:46px 54px;font:15px/1.9 var(--serif)}
.doc h1{text-align:center;font-size:22px;margin:0 0 6px}.doc .by{text-align:center;color:#555;font-size:13px;margin-bottom:24px}.doc h2{font-size:17px;margin:24px 0 6px}.doc p{margin:0 0 6px;text-indent:2em;white-space:pre-wrap}.doc .toc{border:1px solid #ddd;padding:8px 16px;font-size:13px;margin-bottom:12px}.doc .toc div{padding:1px 0}
#err{color:var(--er);white-space:pre-wrap;margin-bottom:10px}.toast{position:fixed;right:18px;bottom:18px;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:3px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
.pane{display:none}.pane.on{display:block}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--bd)}.doc{padding:24px 18px}}

/* forms */
textarea,input,select{background:color-mix(in srgb,var(--card) 70%,var(--bg));border:1px solid var(--bd);border-radius:6px;padding:9px 11px;transition:border-color .15s,box-shadow .15s,background .15s}
textarea:hover,input:hover,select:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
textarea:focus,input:focus,select:focus{background:var(--card);border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 16%,transparent)}
select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent)}
.grid label,label.l{font-size:11.5px;font-weight:600;letter-spacing:.4px;color:var(--navy);margin:0 0 4px;display:block}label.l{margin-top:12px}
.grid{gap:12px 14px}
input[type=file]{padding:0;border:1.5px dashed var(--bd);background:transparent;cursor:pointer;width:auto;min-width:300px;color:var(--mut);font-size:13px}
input[type=file]::file-selector-button{margin:0 12px 0 0;border:0;border-right:1.5px dashed var(--bd);background:var(--acbg);color:var(--ac);padding:10px 16px;font:600 13px inherit;cursor:pointer}
input[type=file]:hover{border-color:var(--ac)}
button{border-radius:6px;font-weight:500;transition:all .15s}button.p{box-shadow:0 1px 0 rgba(0,0,0,.15)}button.p:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 8px color-mix(in srgb,var(--ac) 35%,transparent)}
.sec{border-radius:8px;box-shadow:0 1px 2px rgba(60,40,20,.06)}
/* sidebar rail */
aside{padding:18px 16px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 80%,var(--bg)))}
aside h3{display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:11px;letter-spacing:1.2px}aside h3:after{content:"";flex:1;height:1px;background:var(--bd)}
.meter{height:6px;border-radius:9px;overflow:hidden;background:color-mix(in srgb,var(--bd) 70%,transparent)}.meter i{border-radius:9px;transition:width .4s}
#pgt,#lmt,#qs{font-size:12.5px}
.nav{position:relative;padding-left:2px}.nav:before{content:"";position:absolute;left:13px;top:12px;bottom:12px;width:2px;background:var(--bd)}
.nav a{position:relative;padding:7px 8px 7px 8px;border-radius:6px;gap:12px;z-index:1;border-left:0}
.nav .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--mut);flex:none;transition:.2s}
.nav a.on{background:var(--acbg);color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}.nav a.on .dot{border-color:var(--ac);color:var(--ac)}
.nav .dot.f{background:var(--ok);border-color:var(--ok);color:#fff}
.nav a span.t{flex:1;line-height:1.3}
#qs{background:var(--acbg);padding:8px 10px;border-radius:6px;border-left:3px solid var(--gold);color:var(--tx)}

/* custom dropdown */
option{background:var(--card);color:var(--tx)}

/* mobile */
@media(max-width:820px){
 body{padding-bottom:62px}header{padding:10px 14px;gap:8px}header h1{font-size:15px}header small{display:none}header button{padding:5px 10px;font-size:13px}
 .wrap{display:block}
 aside{border-right:0;border-bottom:1px solid var(--bd);padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
 aside h3{margin:4px 0 2px;font-size:10.5px}aside h3:after{display:none}
 aside h3:nth-of-type(3),aside h3:nth-of-type(4){display:none}#qs{display:none}
 .nav{grid-column:1/-1;display:flex;overflow-x:auto;gap:6px;padding:6px 0 4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .nav::-webkit-scrollbar{display:none}.nav:before{display:none}.nav a{flex:none;border:1px solid var(--bd);padding:4px 10px 4px 5px;gap:6px;background:var(--card);box-shadow:none!important}
 .nav a.on{border-color:var(--ac)}.nav .dot{width:20px;height:20px}.nav a span.t{white-space:nowrap}.nav>span.mut{grid-column:1/-1}
 main{padding:12px 12px 8px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:var(--card);border-top:1px solid var(--bd);border-bottom:0;box-shadow:0 -4px 14px rgba(40,25,10,.1);padding-bottom:env(safe-area-inset-bottom)}
 .tabs button{flex:1;padding:11px 2px 10px;font-size:12px;border-bottom:0;border-top:3px solid transparent;border-radius:0;white-space:nowrap}.tabs button.on{border-top-color:var(--ac)}
 .toast{bottom:74px;left:12px;right:12px;text-align:center}
 .sec{padding:13px 13px}textarea,input,select{font-size:16px}textarea{min-height:90px}
 [data-k=text]{min-height:240px!important}
 .grid{grid-template-columns:1fr 1fr;gap:10px}.grid>div:nth-child(1),.grid>div:nth-child(2){grid-column:1/-1}
 .row{gap:8px}.row button{flex:1 1 auto}.row .sp{display:none}.row input[data-r]{width:100%!important;flex:1 1 100%}
 input[type=file]{min-width:0;width:100%}
 .sum{gap:14px 22px}.sum b{font-size:22px}
 .sec table,.sec tbody,.sec tr,.sec td,.sec th{display:block;width:auto!important}.sec table tr:first-child{display:none}
 .sec table tr{border:1px solid var(--bd);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--card)}.sec td{border:0;padding:2px 0}
 .sec td:nth-child(3):before{content:"位置：";color:var(--mut)}.sec td:nth-child(2){padding:4px 0}
 .doc{padding:22px 16px;font-size:14.5px;line-height:1.85}.doc h1{font-size:19px}
 h2 .tag{float:none!important;display:inline-block;margin-left:8px;vertical-align:middle}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}.tabs button{font-size:11px}}
</style></head><body>
<header><h1>项目申报书生成系统</h1><small>Proposal Agent · 依据申报指南分章节撰写、检查与修订</small><span class="sp"></span>
<button id="sample">载入示例</button><button id="clear">清空</button></header>
<div class="wrap">
<aside><h3>撰写进度</h3><div class="meter"><i id="pgb" style="width:0"></i></div><div class="mut" id="pgt">尚未开始</div>
<h3>字数</h3><div class="meter" id="lm"><i id="lmb" style="width:0"></i></div><div class="mut" id="lmt">—</div>
<h3>章节</h3><div class="nav" id="nav"><span class="mut">生成章节后显示</span></div>
<h3>质量</h3><div class="mut" id="qs">未检查</div></aside>
<main>
<div class="tabs" id="tabs"><button data-t="in" class="on">1 输入</button><button data-t="ed">2 章节撰写</button><button data-t="ck">3 合规检查</button><button data-t="pv">4 预览与导出</button></div>
<div id="err"></div>

<div class="pane on" id="p-in">
<div class="sec"><h2>申报指南</h2><textarea id="guide" style="min-height:150px" placeholder="粘贴申报指南全文，或上传 .txt / .md / .docx / .pdf 文件"></textarea>
<div class="row"><input type="file" id="file" accept=".txt,.md,.docx,.pdf" style="width:auto"><span class="mut" id="fmeta"></span></div></div>
<div class="sec"><h2>项目基本信息</h2><div class="grid">
<div><label>项目名称</label><input id="m-name"></div><div><label>申报单位</label><input id="m-org"></div><div><label>项目负责人</label><input id="m-lead"></div>
<div><label>实施周期</label><input id="m-dur" placeholder="如 18 个月"></div><div><label>申请经费（万元）</label><input id="m-fund"></div><div><label>自筹经费（万元）</label><input id="m-self"></div></div>
<label class="l">项目想法（要解决的问题、拟用方法、已有基础）</label><textarea id="idea" placeholder="缺失的信息会标为 [待补充]，系统不会编造数据或单位名称"></textarea></div>
<div class="sec"><h2>写作要求</h2><div class="grid">
<div><label>语气</label><select id="s-tone"><option>正式、学术</option><option>简洁、务实</option><option>通俗易懂</option></select></div>
<div><label>详略</label><select id="s-len"><option value="">按指南</option><option>每章力求简明</option><option>每章充分展开、论证详尽</option></select></div></div>
<div class="row"><button class="p" id="plan">生成章节规划</button><span class="mut">系统读取指南，列出所需章节、各章提示词及必须满足的要求</span></div></div>
</div>

<div class="pane" id="p-ed"><div id="empty" class="sec mut">请先在“输入”页生成章节规划。</div><div id="list"></div></div>

<div class="pane" id="p-ck"><div class="sec"><h2>合规检查</h2><div id="rt" class="mut">尚未检查。完成章节撰写后点击下方按钮，逐条对照指南要求。</div>
<div class="row"><button class="p" id="chk">开始检查</button><button id="fix">按检查意见自动修订</button></div></div></div>

<div class="pane" id="p-pv"><div class="row" style="margin:0 0 12px"><button class="p" id="exp">导出 Word</button><button id="mdx">导出 Markdown</button><button id="cpy">复制全文</button><span class="mut">下方为排版预览</span></div><div class="doc" id="doc"></div></div>
</main></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),LS='proposal-agent-v2';let chapters=[],items=[],cur=0;
const META=['m-name','m-org','m-lead','m-dur','m-fund','m-self','s-tone','s-len'];
const esc=s=>String(s??'').replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const toast=m=>{$('toast').textContent=m;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)};
async function api(p,b,get){const r=await fetch(p,get?{}:{method:'POST',body:b instanceof ArrayBuffer?b:JSON.stringify(b)});
 if(!r.ok){let m=r.statusText;try{m=(await r.json()).error}catch(e){}throw new Error(m)}return r}
const busy=async(btn,f)=>{const t=btn.textContent;btn.disabled=true;btn.textContent='处理中…';$('err').textContent='';
 try{await f()}catch(e){$('err').textContent='出错：'+e.message}btn.disabled=false;btn.textContent=t};
function idea(){const g=id=>$(id).value.trim(),L=[];
 [['项目名称','m-name'],['申报单位','m-org'],['项目负责人','m-lead'],['实施周期','m-dur'],['申请经费（万元）','m-fund'],['自筹经费（万元）','m-self']].forEach(([k,i])=>g(i)&&L.push(k+'：'+g(i)));
 if(g('idea'))L.push('项目想法：'+g('idea'));L.push('写作要求：语气'+g('s-tone')+(g('s-len')?'；'+g('s-len'):''));return L.join('\n')}
function save(){try{localStorage[LS]=JSON.stringify({g:$('guide').value,i:$('idea').value,m:Object.fromEntries(META.map(k=>[k,$(k).value])),chapters,items})}catch(e){}side()}
document.querySelectorAll('textarea#guide,#idea,.grid input,.grid select').forEach(e=>e.oninput=save);
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id=='p-'+t));if(t=='pv')preview()}
$('tabs').onclick=e=>e.target.dataset.t&&tab(e.target.dataset.t);
function side(){const f=chapters.filter(c=>c.text.trim()).length,n=chapters.reduce((a,c)=>a+c.text.length,0);
 $('pgb').style.width=chapters.length?f/chapters.length*100+'%':0;$('pgt').textContent=chapters.length?`已完成 ${f} / ${chapters.length} 章`:'尚未开始';
 const m=($('guide').value.match(/不(?:得)?超过\s*(\d+)\s*字/)||[])[1];$('lmb').style.width=m?Math.min(n/m*100,100)+'%':0;$('lm').classList.toggle('over',m&&n>m);
 $('lmt').textContent=`${n} 字`+(m?` / 上限 ${m}`:'（指南未限制字数）');
 $('nav').innerHTML=chapters.length?chapters.map((c,i)=>`<a data-i="${i}" class="${i==cur?'on':''}"><span class="dot ${c.text.trim()?'f':''}">${c.text.trim()?'✓':i+1}</span><span class="t">${esc(c.title)}</span></a>`).join(''):'<span class="mut">生成章节后显示</span>';
 const ok=items.filter(x=>x.status=='ok').length;$('qs').textContent=items.length?`满足 ${ok} / ${items.length} 项要求`:'未检查'}
$('nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;cur=+a.dataset.i;tab('ed');render()};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;await busy($('plan'),async()=>{const r=await api('/api/extract?name='+encodeURIComponent(f.name),await f.arrayBuffer());
 $('guide').value=(await r.json()).text;$('fmeta').textContent=f.name+'，共 '+$('guide').value.length+' 字符';save()})};
$('sample').onclick=()=>busy($('sample'),async()=>{const j=await(await api('/api/sample',0,1)).json();$('guide').value=j.guide;$('idea').value=j.idea;
 Object.entries({'m-name':'面向本科生的 AI 学习助手','m-org':'四川大学（示例）','m-lead':'示例负责人','m-dur':'18 个月','m-fund':'40','m-self':'10'}).forEach(([k,v])=>$(k).value=v);save();toast('已载入示例')});
$('clear').onclick=()=>{if(!confirm('清空所有内容？'))return;chapters=[];items=[];[...META,'guide','idea'].forEach(k=>{if($(k).tagName!='SELECT')$(k).value=''});save();render()};
$('plan').onclick=()=>busy($('plan'),async()=>{if(!$('guide').value.trim())throw new Error('请先提供申报指南');
 chapters=(await(await api('/api/outline',{guide:$('guide').value,idea:idea()})).json()).chapters.map(c=>({...c,text:'',hist:[]}));items=[];cur=0;save();render();tab('ed')});
function render(){$('empty').hidden=chapters.length>0;$('list').innerHTML='';if(!chapters.length)return side();
 const i=cur,c=chapters[i],d=document.createElement('div');d.className='sec';
 d.innerHTML=`<h2>第 ${i+1} 章　${esc(c.title)} <span class="tag ${c.text.trim()?'ok':''}" style="float:right">${c.text.trim()?c.text.length+' 字':'未撰写'}</span></h2>
 ${c.requirements&&c.requirements.length?`<div class="req"><b>指南对本章的要求：</b>${esc(c.requirements.join('；'))}</div>`:''}
 <label class="l">本章提示词（可修改后重新生成）</label><textarea data-k="prompt" style="min-height:70px"></textarea>
 <label class="l">正文（可直接编辑）</label><textarea data-k="text" style="min-height:300px"></textarea>
 <div class="row"><button class="p" data-g>${c.text.trim()?'重新生成':'生成本章'}</button><button data-u ${c.hist.length?'':'disabled'}>撤销上一次修改</button><span class="sp"></span>
 <input data-r placeholder="修订指令，如：压缩到 500 字 / 增加量化指标" style="width:300px"><button data-v>按指令修订</button></div>
 <div class="row"><button data-p ${i?'':'disabled'}>上一章</button><button data-n ${i<chapters.length-1?'':'disabled'}>下一章</button><span class="sp"></span><button data-all>从头到尾生成全部章节</button></div>`;
 d.querySelectorAll('[data-k]').forEach(el=>{el.value=c[el.dataset.k]||'';el.oninput=()=>{c[el.dataset.k]=el.value;save()}});
 d.querySelector('[data-g]').onclick=e=>busy(e.currentTarget,async()=>{await gen(i);render()});
 d.querySelector('[data-u]').onclick=()=>{c.text=c.hist.pop();save();render()};
 d.querySelector('[data-v]').onclick=e=>busy(e.currentTarget,async()=>{const ins=d.querySelector('[data-r]').value.trim();if(!ins||!c.text.trim())throw new Error('请先生成本章并填写修订指令');await rev(i,ins);render()});
 d.querySelector('[data-p]').onclick=()=>{cur--;render()};d.querySelector('[data-n]').onclick=()=>{cur++;render()};
 d.querySelector('[data-all]').onclick=e=>busy(e.currentTarget,async()=>{for(let k=0;k<chapters.length;k++){cur=k;side();$('pgt').textContent=`正在撰写第 ${k+1} / ${chapters.length} 章…`;await gen(k)}render();toast('全部章节已生成')});
 $('list').append(d);side()}
const put=(c,t)=>{if(c.text.trim())c.hist.push(c.text);c.text=t;save()};
async function gen(i){const j=await(await api('/api/chapter',{guide:$('guide').value,idea:idea(),chapter:chapters[i],previous:chapters.slice(0,i).filter(c=>c.text.trim())})).json();put(chapters[i],j.text)}
async function rev(i,ins){const j=await(await api('/api/revise',{guide:$('guide').value,idea:idea(),chapter:chapters[i],instruction:ins})).json();put(chapters[i],j.text);toast('已修订：'+chapters[i].title)}
$('chk').onclick=()=>busy($('chk'),async()=>{const cs=chapters.filter(c=>c.text.trim());if(!cs.length)throw new Error('请先撰写章节');
 items=(await(await api('/api/check',{guide:$('guide').value,chapters:cs})).json()).items;save();report()});
function report(){if(!items.length)return;const c=s=>items.filter(x=>x.status==s).length,un=chapters.filter(x=>!x.text.trim()).length;
 $('rt').className='';$('rt').innerHTML=`<div class="sum"><div><b>${Math.round((c('ok')+c('partial')/2)/items.length*100)}%</b><span>综合符合度</span></div><div><b style="color:var(--ok)">${c('ok')}</b><span>已满足</span></div><div><b style="color:var(--wa)">${c('partial')}</b><span>部分满足</span></div><div><b style="color:var(--er)">${c('missing')}</b><span>缺失</span></div></div>
 ${un?`<div class="req">尚有 ${un} 章未撰写，相关要求会被判为缺失；请先完成全部章节再检查。</div>`:''}
 <table><tr><th>指南要求</th><th style="width:70px">状态</th><th style="width:150px">位置</th><th>说明</th></tr>${items.map(x=>`<tr><td>${esc(x.requirement)}</td><td><span class="tag ${esc(x.status)}">${{ok:'满足',partial:'部分',missing:'缺失'}[x.status]||esc(x.status)}</span></td><td>${esc(x.where)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table>`}
$('fix').onclick=()=>busy($('fix'),async()=>{if(!items.length)throw new Error('请先检查');let n=0;
 for(let i=0;i<chapters.length;i++){const bad=items.filter(x=>x.status!='ok'&&x.where&&x.where.includes(chapters[i].title)&&chapters[i].text.trim());if(!bad.length)continue;
  await rev(i,'请修正以下问题：\n'+bad.map(x=>`- ${x.requirement}：${x.note}`).join('\n'));n++}
 toast(n?`已修订 ${n} 章，请重新检查（可在章节页撤销）`:'没有可自动修订的章节；缺失的章节请先撰写');side()});
const done=()=>{const c=chapters.filter(x=>x.text.trim());if(!c.length)throw new Error('请先撰写章节');return c},title=()=>$('m-name').value.trim()||'项目申报书';
function preview(){const c=chapters.filter(x=>x.text.trim());$('doc').innerHTML=c.length?`<h1>${esc(title())}</h1><div class="by">${esc([$('m-org').value,$('m-lead').value].filter(Boolean).join('　'))}</div>
 <div class="toc">${c.map((x,i)=>`<div>${i+1}. ${esc(x.title)}</div>`).join('')}</div>${c.map((x,i)=>`<h2>${i+1}. ${esc(x.title)}</h2>${x.text.split('\n').filter(l=>l.trim()).map(l=>`<p>${esc(l.replace(/^[#*\s]+/,'').replace(/\*\*/g,''))}</p>`).join('')}`).join('')}`:'<p style="text-indent:0;color:#777">尚无内容。</p>'}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
$('exp').onclick=()=>busy($('exp'),async()=>{dl(await(await api('/api/export',{title:title(),chapters:done()})).blob(),'proposal.docx')});
$('mdx').onclick=()=>{try{dl(new Blob([`# ${title()}\n\n`+done().map(x=>`## ${x.title}\n\n${x.text}\n`).join('\n')],{type:'text/markdown'}),'proposal.md')}catch(e){$('err').textContent=e.message}};
$('cpy').onclick=async()=>{try{await navigator.clipboard.writeText(done().map(x=>x.title+'\n'+x.text).join('\n\n'));toast('已复制')}catch(e){$('err').textContent=e.message}};
try{const s=JSON.parse(localStorage[LS]||'null');if(s){$('guide').value=s.g;$('idea').value=s.i;Object.entries(s.m||{}).forEach(([k,v])=>$(k).value=v);chapters=s.chapters||[];items=s.items||[]}}catch(e){}

render();report();
</script></body></html>
